# Build KuyMediaBox; terbitkan ke GitHub Releases setiap kali tag versi (v*) di-push.
#   git tag v0.1.0
#   git push origin v0.1.0
name: Release

on:
  push:
    tags: ['v*']
    branches: [main] # push ke main = build + test saja (tanpa release)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # riwayat & tag dibutuhkan untuk catatan rilis

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Pasang Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0

      - name: Pasang NSIS (untuk installer)
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
            "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }

      - name: Tentukan versi
        shell: pwsh
        run: |
          $j = Get-Content wails.json -Raw | ConvertFrom-Json
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { $j.info.productVersion }
          $j.info.productVersion = $ver
          $j | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
          "APP_VERSION=$ver" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "Versi: $ver"

      - name: Build aplikasi + installer
        run: wails build -clean -trimpath -tags nodynamic -ldflags "-s -w -X main.Version=${{ env.APP_VERSION }}" -nsis

      - name: Unit test
        run: go test -tags nodynamic ./...

      - name: Cek tipe frontend
        working-directory: frontend
        run: npx svelte-check --tsconfig ./tsconfig.json

      - name: Siapkan file release
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'dev' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/bin/KuyMediaBox.exe "dist/KuyMediaBox-$ver-windows-x64-portable.exe"
          Compress-Archive -Path build/bin/KuyMediaBox.exe -DestinationPath "dist/KuyMediaBox-$ver-windows-x64-portable.zip"
          $installer = Get-ChildItem build/bin -Filter '*installer*.exe' | Select-Object -First 1
          if ($installer) { Copy-Item $installer.FullName "dist/KuyMediaBox-$ver-windows-x64-setup.exe" }
          # Hitung checksum dulu, baru tulis file (jangan meng-hash SHA256SUMS.txt yang sedang ditulis).
          $sums = Get-ChildItem dist -File | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $sums | Out-File dist/SHA256SUMS.txt -Encoding utf8
          Get-ChildItem dist

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v7
        with:
          name: KuyMediaBox-windows
          path: dist/*

      - name: Susun catatan rilis
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          PREV=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$TAG"; else RANGE="$TAG"; fi
          CHANGES=$(git log "$RANGE" --no-merges --pretty=format:'- %s' | head -50)
          [ -z "$CHANGES" ] && CHANGES="- Perbaikan dan peningkatan"
          {
            echo "## Yang baru"
            echo "$CHANGES"
            echo
            echo "## Unduh"
            echo "- **KuyMediaBox-$TAG-windows-x64-setup.exe**: installer (shortcut Desktop & Start Menu, bisa di-uninstall)"
            echo "- **KuyMediaBox-$TAG-windows-x64-portable.exe**: langsung jalan tanpa instal"
            echo "- **KuyMediaBox-$TAG-windows-x64-portable.zip**: versi portable dalam zip"
            echo
            echo "Butuh Windows 10/11 64-bit. Sudah memakai KuyMediaBox? Aplikasi akan menawarkan update ini secara otomatis."
            echo "Cek keaslian file dengan SHA256SUMS.txt."
            if [ -n "$PREV" ]; then
              echo
              echo "**Perubahan lengkap**: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Terbitkan GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v3
        with:
          name: KuyMediaBox ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
